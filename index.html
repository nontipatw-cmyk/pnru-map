<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNRU Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; }
        .popup-content { font-family: 'Sarabun', sans-serif; font-size: 14px; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. ตั้งค่าแผนที่
    var map = L.map('map').setView([13.878, 100.591], 17);

    // 2. แผนที่ดาวเทียม
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        attribution: 'Google Maps'
    }).addTo(map);

    // 3. ฟังก์ชันดึงข้อมูลจากไฟล์ a.txt (GeoJSON)
    fetch('a.txt')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: function(feature) {
                    return {
                        color: "#FFD700",
                        weight: 2,
                        fillOpacity: 0.5
                    };
                },
                onEachFeature: function (feature, layer) {
                    // ดึงข้อมูลจาก properties มาโชว์ใน Popup
                    let popupText = "<div class='popup-content'><b>รายละเอียดอาคาร/จุด</b><br>";
                    
                    if (feature.properties) {
                        for (let key in feature.properties) {
                            popupText += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                        }
                    }
                    popupText += "</div>";
                    layer.bindPopup(popupText);

                    // เอฟเฟกต์ Hover
                    layer.on('mouseover', function() { this.setStyle({ fillOpacity: 0.8 }); });
                    layer.on('mouseout', function() { this.setStyle({ fillOpacity: 0.5 }); });
                }
            }).addTo(map);
        })
        .catch(error => console.error('Error loading GeoJSON:', error));
</script>
</body>
</html>
